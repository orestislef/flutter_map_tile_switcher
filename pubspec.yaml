name: flutter_map_tile_switcher
description: A flutter_map plugin for easy switching between map tile providers (OpenStreetMap, Google Maps, Satellite) with built-in caching and automatic dark mode support.
version: 0.0.2
homepage: https://github.com/orestislef/flutter_map_tile_switcher
repository: https://github.com/orestislef/flutter_map_tile_switcher
issue_tracker: https://github.com/orestislef/flutter_map_tile_switcher/issues
topics:
  - map
  - flutter-map
  - tiles
  - caching
  - openstreetmap

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_map_cache: ^2.0.0+1
  http_cache_file_store: ^2.0.1
  path_provider: ^2.1.5
  dio_cache_interceptor: ^4.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
